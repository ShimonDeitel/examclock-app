name: Examclock
options:
  bundleIdPrefix: com.shimondeitel.examclock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Examclock:
    type: application
    platform: iOS
    sources:
      - path: Examclock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.examclock
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Examclock/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ExamclockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExamclockTests
      - path: Examclock.storekit
    dependencies:
      - target: Examclock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.examclock.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  ExamclockUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ExamclockUITests
    dependencies:
      - target: Examclock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.examclock.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Examclock:
    build:
      targets:
        Examclock: all
        ExamclockTests: [test]
        ExamclockUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Examclock.storekit
    test:
      config: Debug
      storeKitConfiguration: Examclock.storekit
      targets:
        - ExamclockTests
        - ExamclockUITests
    archive:
      config: Release
